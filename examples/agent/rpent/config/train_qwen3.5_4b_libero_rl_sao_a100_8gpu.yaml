# Single-node A100 80 GB profile, 32 episodes per update and 32 environments.
defaults:
  - train_qwen3.5_4b_libero_rl_sao_a100
  - _self_

cluster:
  component_placement:
    actor: 0-3
    critic: 0-3
    rollout:
      placement: 4-5
    reward: 4-5
    agentloop: 6-7

runner:
  experiment_name: sao-b32e32
  max_epochs: 2147483647
  max_steps: -1
  save_interval: 5
  seq_length: 262144
  max_tokens_per_mbs: ${runner.seq_length}

data:
  rollout_batch_size: 32

rollout_buffer:
  max_inflight_groups: 32
  max_buffered_groups: 64

rollout:
  max_running_requests: 16
  collect_meta_stats: false
  sglang:
    context_length: ${runner.seq_length}

algorithm:
  sampling_params:
    max_new_tokens: 32768

# A long visual sequence can exceed the four-GPU profile's CPU prefetch budget.
actor:
  multimodal:
    prefetch_batches: 0
critic:
  multimodal:
    prefetch_batches: 0

agentloop:
  max_turns: 100
  model_request_timeout_s: 3600
  episode_timeout_s: 14400
  history_compaction:
    max_messages: 80
    keep_messages: 40

tools:
  rpent:
    env_gpus: [6, 7]
    episodes_per_worker: 16
    max_episode_steps: 10000
    process_timeout_s: 15000
    sam3_endpoint: http://127.0.0.1:18261
