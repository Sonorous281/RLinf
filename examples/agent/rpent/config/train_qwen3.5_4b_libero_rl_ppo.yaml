# Adaptive multimodal PPO; deployment paths belong in the local profile.
defaults:
  - train_qwen3.5_4b_ppo
  - _self_

runner:
  experiment_name: rpent-libero-rl-qwen3.5-4b-ppo
  max_epochs: 10
  max_steps: -1
  save_interval: 5
  seq_length: 262144

algorithm:
  sampling_params:
    temperature: 1.0
    # Keep rollout probabilities on the full model support for PPO/SAO ratios.
    top_k: -1
    top_p: 1.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    max_new_tokens: 32768

data:
  train_data_paths: ???
  rollout_batch_size: 128
  shuffle: true

agentloop:
  # Count recovered retries without rejecting a complete, valid training batch.
  max_infra_retry_rate: 1.0
  # Optional forced closure of the first open thinking span; null disables it.
  thinking_token_budget: null
  chat_template_kwargs:
    enable_thinking: true
    preserve_thinking: true
  observation_mode: adaptive
  prompt: simple
  max_turns: 100
  model_request_timeout_s: 3600
  episode_timeout_s: 14400
  history_compaction:
    max_messages: 80
    keep_messages: 40
    context_window: ${runner.seq_length}
    max_fraction: 0.7

tools:
  rpent:
    workflow: libero_rl
    python: ???
    vla_endpoint: null
    frozen_memory_dir: null
    libero_type: standard
    libero_config_path: ???
    max_episode_steps: 10000
    env_gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    # Eight workers can run all 256 default SAO in-flight episodes.
    episodes_per_worker: 32
    # Limit cold-start pressure; reset environments release these permits.
    max_env_initializations_per_worker: 8
    output_dir: ???
    # Requires a shared output_dir retained through checkpoint recovery.
    store_images_on_disk: false
    keep_episodes: all
    process_timeout_s: 15000

rollout:
  # The SGLang memory saver requires the non-expandable allocator.
  env_vars:
    SGLANG_EXTERNAL_MM_PROCESSOR_PACKAGE: rlinf.hybrid_engines.sglang.multimodal
    PYTORCH_ALLOC_CONF: expandable_segments:False
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
  model:
    model_path: ???
  gpu_memory_utilization: 0.7
  max_running_requests: 128
  replica_affinity: false
  sglang:
    # Experimental; see the deployment guide for dependency and media requirements.
    enable_shared_multi_modal_processor: false
    enable_token_space_preprocess_cache: false
    token_space_preprocess_cache_dir: null
    token_space_preprocess_cache_trust_url: false
    token_space_preprocess_cache_check_rate: 0.0
    context_length: 262144
    mamba_full_memory_ratio: 0.2
    # Presence penalties and thinking limits require the current token history.
    disable_overlap_schedule: true
    enable_custom_logit_processor: false

actor:
  multimodal: {}
  expect_multi_modal_inputs: true
  trim_right_padding: true
  model:
    attention_backend: flash
    # Zero keeps the normal projection; positive values chunk scored positions.
    lm_head_chunk_size: 0
    freeze_vision_model: true
    freeze_vision_projection: true
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
  megatron:
    distributed_timeout_minutes: 180
    ckpt_convertor:
      hf_model_path: ${rollout.model.model_path}

critic:
  multimodal: {}
  trim_right_padding: true
  model:
    attention_backend: flash
    freeze_vision_model: true
    freeze_vision_projection: true
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
  megatron:
    distributed_timeout_minutes: 180
    ckpt_convertor:
      hf_model_path: ${rollout.model.model_path}
