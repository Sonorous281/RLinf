defaults:
  - train_qwen3.5_4b_grpo
  - _self_

cluster:
  component_placement:
    critic: 0-1

runner:
  synchronous: false
  async_mode: true
  seq_length: 16384
  experiment_name: rpent-sao

algorithm:
  adv_type: sao_gae
  group_size: 1
  sampling_params:
    max_new_tokens: 2048
  loss_type: dis
  critic_loss_type: mse
  clip_ratio_low: 0.3
  clip_ratio_high: 5.0
  gae_lambda_alpha: 1.5
  value_cliprange: 0.2
  loss_scales: []
  normalize_advantages: true

data:
  sampling_batch_size: 4

tools:
  rpent:
    workflow: libero_rl
    libero_type: standard

agentloop:
  max_actor_accept_staleness: 1

critic:
  update_epochs: 2
  compute_advantages_after_update: true
  use_critic_model: true
  value_head_init: normal
  group_name: CriticGroup
  training_backend: megatron
  mcore_gpt: true
  spec_name: decoder_gpt
  enable_dp_load_balance: true
  seed: 1234
  offload_optimizer: true
  offload_weight: true
  offload_grad: true
  model: ${actor.model}
  optim:
    optimizer: adam
    bf16: true
    fp16: false
    lr: 5.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.98
    adam_eps: 1.0e-08
    min_lr: 0.0
    weight_decay: 0.0
    clip_grad: 1.0
    use_distributed_optimizer: true
    overlap_grad_reduce: false
    overlap_param_gather: false
    optimizer_enable_pin: false
    overlap_param_gather_with_optimizer_step: false
    optimizer_cpu_offload: true
    optimizer_offload_fraction: 1.0
  lr_sched:
    lr_warmup_fraction: null
    lr_warmup_init: ${critic.optim.lr}
    lr_warmup_iters: 0
    max_lr: 5.0e-06
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 10
  tokenizer: ${actor.tokenizer}
  megatron: ${actor.megatron}
  multimodal: ${actor.multimodal}
  trim_right_padding: true
